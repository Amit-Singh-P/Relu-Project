<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Insight Enrichment</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Company Insight Enrichment</h1>
    <p class="subtitle">Scrape a company website and generate outreach-ready business insights.</p>
  </header>

  <section class="settings-bar">
    <label for="api-base">Backend API URL</label>
    <input id="api-base" type="text" placeholder="http://localhost:8000" />
    <span id="api-status" class="status-dot" title="Unknown"></span>
  </section>

  <main>
    <section class="card">
      <h2>Enrich a Company</h2>
      <form id="enrich-form">
        <div class="field">
          <label for="website-name">Website Name (label)</label>
          <input id="website-name" type="text" placeholder="e.g. Acme Tech Solutions" />
        </div>
        <div class="field">
          <label for="website-url">Company URL</label>
          <input id="website-url" type="text" placeholder="https://www.example.com" required />
        </div>
        <button id="enrich-btn" type="submit">Enrich</button>
      </form>
      <div id="enrich-status" class="status-line" role="status"></div>
      <div id="enrich-result" class="result-panel"></div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>All Enriched Companies</h2>
        <button id="results-btn" type="button">Show All Results</button>
      </div>
      <div id="results-status" class="status-line" role="status"></div>
      <div id="results-panel" class="results-panel"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
